name: macOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pyaudio je često problematičan na macOS-u (portaudio). Za build nam nije kritičan.
        # Instaliraj sve iz requirements.txt osim pyaudio; voice feature može ostati "optional".
        python -c "
        import re
        from pathlib import Path

        src = Path('requirements.txt').read_text(encoding='utf-8').splitlines()
        out = []
        for line in src:
            raw = line.strip()
            if not raw or raw.startswith('#'):
                continue
            # remove inline comments (na siguran način)
            raw = re.split(r'\s+#', raw, maxsplit=1)[0].strip()
            if not raw:
                continue
            if raw.lower().startswith('pyaudio'):
                continue
            out.append(raw)
        Path('requirements_temp.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
        "
        pip install -r requirements_temp.txt

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Create build directory
      run: |
        mkdir -p build dist release

    - name: Run PyInstaller
      run: |
        # Kreiraj spec fajl prvo
        pyi-makespec --noconfirm --windowed \
          --name "ProfesorAbelton" \
          --add-data "Config:Config" \
          --add-data "RemoteScript:RemoteScript" \
          --add-data "Docs:Docs" \
          --add-data "FAQ.md:." \
          --add-data "USER_MANUAL.md:." \
          --add-data "README.md:." \
          --add-data "LICENSE.txt:." \
          --add-data "GUMROAD_README.txt:." \
          --hidden-import "GUI.profesor_ableton_gui" \
          --hidden-import "GUI.first_launch_wizard" \
          --hidden-import "Server.ai_copilot_server" \
          --hidden-import "Utils.api_key_manager" \
          --hidden-import "Utils.ableton_detector" \
          launch_profesor_ableton.py

        # Buildaj sa spec fajlom
        pyinstaller --noconfirm --clean ProfesorAbelton.spec

    - name: Code sign app bundle
      run: |
        # Ad-hoc code signing to bypass Gatekeeper
        if [ -d "dist/ProfesorAbelton.app" ]; then
            echo "🔐 Code signing app bundle..."
            # Remove existing signature first
            codesign --remove-signature "dist/ProfesorAbelton.app" 2>/dev/null || true
            # Ad-hoc signing
            codesign --force --deep --sign - "dist/ProfesorAbelton.app"
            # Verify signing
            if codesign -v "dist/ProfesorAbelton.app"; then
                echo "✅ App bundle successfully code signed"
            else
                echo "⚠️ Code signing completed but verification failed"
            fi
        else
            echo "❌ App bundle not found"
            exit 1
        fi

    - name: Create ZIP for distribution
      run: |
        cd dist
        ditto -c -k --sequesterRsrc --keepParent "ProfesorAbelton.app" "../release/ProfesorAbelton_macOS_v2.0.0.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          dist/ProfesorAbelton.app
          release/ProfesorAbelton_macOS_v2.0.0.zip